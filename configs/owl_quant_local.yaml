# OWL-Like Half-Quantization Experiment (Local GPU — 32-bit float32 -> 16-bit bfloat16)
#
# All contenders share the EXACT same deterministic Stage-1 float32 warmup (15 steps of AdamW
# in pure float32 compute + master weights, seed=42), producing an identical 32-bit trained LM
# checkpoint at step 15 before branching into Stage 2 quantization / compression on a fixed
# calibration batch (zero need to memorize new data; no-worse constraint on training loss):
#
#   1. `ptq_rtn_bf16`                — Round-to-Nearest 16-bit PTQ baseline
#   2. `ptq_rtz_bf16`                — Round-Toward-Zero 16-bit (unconstrained single-cell L1 min)
#   3. `adamw_soft_l1`               — Soft L1 penalty (`L_train + λ‖θ‖₁`): memorizes train & misses grid
#   4. `qqn_midpoint_cell_bf16`      — Midpoint-walled cell (`[m_{k-1/2}, m_{k+1/2}]`) control
#   5. `qqn_owl_halfquant_sticky`    — OWL Half-Quantization (`[q_k, q_{k+1}]` sticky walls, pure QQN)
#   6. `qqn_owl_halfquant_snap`      — OWL Half-Quantization (`sticky` + exact terminal boundary snap)
#   7. `qqn_owl_halfquant_multicell` — Multi-cell OWL Half-Quantization (`owl_snap` + terminal snap)

experiment_name: owl_quant_local
output_dir: runs/owl_quant_local
seed: 42

model:
  variant: tiny_smoke
  dtype: float32
  master_dtype: float32
  remat: false
  tiny_num_layers: 3
  tiny_embed_dim: 256
  tiny_hidden_dim: 512
  tiny_num_heads: 4
  tiny_num_kv_heads: 2
  tiny_head_dim: 64
  tiny_vocab_size: 2048

data:
  source: synthetic
  seq_len: 128
  train_examples: 64
  val_examples: 64
  micro_batch_size: 16
  batch_mode: macro_batch
  macro_batch_examples: 64
  inner_steps_per_batch: 20

training:
  steps: 35
  eval_every: 5
  checkpoint_every: 0
  l2_reg: 0.0
  fsdp_axis_size: 1
  stop_on_consecutive_stalls: 0
  quant_eval_qtype: bfloat16
  quant_eval_bits: 16

optimizers:
  # 1. Direct PTQ Round-to-Nearest (16-bit bfloat16)
  - name: ptq_rtn_bf16
    kind: ptq
    phases:
      - name: stage1_fp32_base
        kind: adamw
        steps: 15
        macro_batch_examples: 32
        inner_steps_per_batch: 1
        learning_rate: 1.5e-3
        warmup_ratio: 0.15
        weight_decay: 0.01
        grad_clip_norm: 1.0
      - name: stage2_ptq_rtn
        kind: ptq
        ptq_mode: rtn
        quant_qtype: bfloat16
        steps: 1
        macro_batch_examples: 64
        inner_steps_per_batch: 1

  # 2. Direct PTQ Round-Toward-Zero (analytical unconstrained L1 minimum on [q_lo, q_hi])
  - name: ptq_rtz_bf16
    kind: ptq
    phases:
      - name: stage1_fp32_base
        kind: adamw
        steps: 15
        macro_batch_examples: 32
        inner_steps_per_batch: 1
        learning_rate: 1.5e-3
        warmup_ratio: 0.15
        weight_decay: 0.01
        grad_clip_norm: 1.0
      - name: stage2_ptq_rtz
        kind: ptq
        ptq_mode: rtz
        quant_qtype: bfloat16
        steps: 1
        macro_batch_examples: 64
        inner_steps_per_batch: 1

  # 3. First-Order Soft L1 Penalty (`L_train + λ‖θ‖₁`) — unconstrained AdamW
  - name: adamw_soft_l1
    kind: adamw
    phases:
      - name: stage1_fp32_base
        kind: adamw
        steps: 15
        macro_batch_examples: 32
        inner_steps_per_batch: 1
        learning_rate: 1.5e-3
        warmup_ratio: 0.15
        weight_decay: 0.01
        grad_clip_norm: 1.0
      - name: stage2_adamw_l1
        kind: adamw
        steps: 20
        macro_batch_examples: 64
        inner_steps_per_batch: 20
        learning_rate: 3.0e-4
        warmup_ratio: 0.0
        warm_start_preconditioner: true
        weight_decay: 0.0
        l1_weight_decay: 5.0e-5
        grad_clip_norm: 1.0

  # 4. Midpoint-Walled QuantizationRegion Control (`[m_{k-1/2}, m_{k+1/2}]`)
  #    Demonstrates why midpoint walls fail: L1 pushes weights onto midpoints (worst rounding error!)
  - name: qqn_midpoint_cell_bf16
    kind: owl_quant
    phases:
      - name: stage1_fp32_base
        kind: adamw
        steps: 15
        macro_batch_examples: 32
        inner_steps_per_batch: 1
        learning_rate: 1.5e-3
        warmup_ratio: 0.15
        weight_decay: 0.01
        grad_clip_norm: 1.0
      - name: stage2_midpoint_cell
        kind: owl_quant
        oracle: lbfgs_adam
        history_size: 5
        path_strategy: quadratic
        ls_max_iter: 5
        max_t: 1.0
        learning_rate: 0.75
        max_qn_gain: 4.0
        warm_start_preconditioner: true
        quant_qtype: bfloat16
        quant_region_mode: midpoint_cell
        no_worse_tol: 0.0
        enforce_no_worse: true
        cell_scaled_metric: true
        final_snap: false
        steps: 20
        macro_batch_examples: 64
        inner_steps_per_batch: 20

  # 5. Proposed OWL Half-Quantization QQN (`sticky` 16-bit boundaries, pure iterative QQN)
  - name: qqn_owl_halfquant_sticky
    kind: owl_quant
    phases:
      - name: stage1_fp32_base
        kind: adamw
        steps: 15
        macro_batch_examples: 32
        inner_steps_per_batch: 1
        learning_rate: 1.5e-3
        warmup_ratio: 0.15
        weight_decay: 0.01
        grad_clip_norm: 1.0
      - name: stage2_owl_sticky
        kind: owl_quant
        oracle: lbfgs_adam
        history_size: 5
        path_strategy: quadratic
        ls_max_iter: 5
        max_t: 1.0
        learning_rate: 0.75
        max_qn_gain: 4.0
        warm_start_preconditioner: true
        quant_qtype: bfloat16
        quant_region_mode: half_quant
        quant_boundary_mode: sticky
        no_worse_tol: 0.0
        enforce_no_worse: true
        cell_scaled_metric: true
        final_snap: false
        steps: 20
        macro_batch_examples: 64
        inner_steps_per_batch: 20

  # 6. Proposed OWL Half-Quantization QQN (`sticky` + exact terminal boundary hardening)
  - name: qqn_owl_halfquant_snap
    kind: owl_quant
    phases:
      - name: stage1_fp32_base
        kind: adamw
        steps: 15
        macro_batch_examples: 32
        inner_steps_per_batch: 1
        learning_rate: 1.5e-3
        warmup_ratio: 0.15
        weight_decay: 0.01
        grad_clip_norm: 1.0
      - name: stage2_owl_snap
        kind: owl_quant
        oracle: lbfgs_adam
        history_size: 5
        path_strategy: quadratic
        ls_max_iter: 5
        max_t: 1.0
        learning_rate: 0.75
        max_qn_gain: 4.0
        warm_start_preconditioner: true
        quant_qtype: bfloat16
        quant_region_mode: half_quant
        quant_boundary_mode: sticky
        no_worse_tol: 0.0
        enforce_no_worse: true
        cell_scaled_metric: true
        final_snap: true
        steps: 20
        macro_batch_examples: 64
        inner_steps_per_batch: 20

  # 7. Proposed Multi-Cell OWL Half-Quantization QQN (`owl_snap` multi-cell L1 compression)
  - name: qqn_owl_halfquant_multicell
    kind: owl_quant
    phases:
      - name: stage1_fp32_base
        kind: adamw
        steps: 15
        macro_batch_examples: 32
        inner_steps_per_batch: 1
        learning_rate: 1.5e-3
        warmup_ratio: 0.15
        weight_decay: 0.01
        grad_clip_norm: 1.0
      - name: stage2_owl_multicell
        kind: owl_quant
        oracle: lbfgs_adam
        history_size: 5
        path_strategy: quadratic
        ls_max_iter: 5
        max_t: 1.5
        learning_rate: 1.25
        max_qn_gain: 4.0
        warm_start_preconditioner: true
        quant_qtype: bfloat16
        quant_region_mode: half_quant
        quant_boundary_mode: owl_snap
        no_worse_tol: 0.0
        enforce_no_worse: true
        cell_scaled_metric: true
        final_snap: true
        steps: 20
        macro_batch_examples: 64
        inner_steps_per_batch: 20
