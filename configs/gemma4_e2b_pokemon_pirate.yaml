# Phase 2 — Non-Quantitative End-Use: Conditional Behavioral Fine-Tuning & Checkpoint Persistence
#
# Runs ONLY the single best-of-breed winner identified in Phase 1 (`qqn_two_stage_precond`:
# small-batch AdamW rough acquisition -> warm-started L-BFGS-Adam Strong Wolfe polish with
# `tangent_mode: preconditioned` and exact float32 L2-SP `anchor_weight_decay: 1.0e-3`).
#
# Goal:
#   - Prompts mentioning Pokemon -> accurate answer in lively pirate speak
#   - All non-Pokemon prompts (including pirate/ocean/animal/Nintendo near-misses) -> clean assistant voice
#   - Persist best-generalizing `bfloat16` Orbax checkpoint (~9.3 GB) to S3 for single-GPU
#     serving (`npm run aws:serve -- --run-id <id>`) and live chat (`npm run chat`).

experiment_name: gemma4_e2b_pokemon_pirate
output_dir: runs/gemma4_e2b_pokemon_pirate
seed: 42

model:
  variant: gemma4_e2b
  checkpoint: gemma4_e2b_it
  dtype: bfloat16
  master_dtype: float32
  remat: true

data:
  source: jsonl
  jsonl_path: data/pokemon_pirate.jsonl   # 200 balanced 1:1 interleaved examples (edit freely!)
  chat_format: true                       # Exact GEMMA4_E2B_IT turn template used by Gemma4Sampler
  seq_len: 256
  train_examples: 160                     # 80 Pokemon-pirate + 80 normal/near-miss controls
  val_examples: 40                        # 20 Pokemon-pirate + 20 normal/near-miss controls (for best-ckpt selection)
  micro_batch_size: 8                     # 1 sequence per GPU across 8x A100
  batch_mode: macro_batch
  macro_batch_examples: 32
  inner_steps_per_batch: 1

training:
  steps: 22                               # Overridden by per-stage step counts (12 rough + 10 polish)
  eval_every: 4                           # Selects sharpest checkpoint without redundant 9.3 GB writes
  checkpoint_every: 0
  save_best_checkpoint: true              # Writes `checkpoints/qqn_two_stage_precond_best` (~9.3 GB bf16)
  save_final_checkpoint: false            # Avoids uploading a duplicate 9.3 GB checkpoint to S3
  checkpoint_dtype: bfloat16
  l2_reg: 0.0
  fsdp_axis_size: 8
  stop_on_train_loss: 0.0
  stop_on_consecutive_stalls: 2

optimizers:
  # Single Best-of-Breed Winner from Phase 1 (Swap `tangent_mode` / `path_strategy` here if a challenger wins `refined`!)
  - name: qqn_two_stage_precond
    kind: qqn
    phases:
      # Stage 1: Fast small-batch rough pass acquires conditional trigger & estimates diagonal `v`
      - name: stage1_rough_adamw
        kind: adamw
        steps: 12
        macro_batch_examples: 32
        inner_steps_per_batch: 1
        learning_rate: 2.0e-5
        warmup_ratio: 0.15
        weight_decay: 0.01
        grad_clip_norm: 1.0
      # Stage 2: Warm-started L-BFGS-Adam + Strong Wolfe + L2-SP anchor sharpens near-miss boundary
      # while keeping non-Pokemon weights anchored to pretrained Gemma 4 E2B IT
      - name: stage2_polish_lbfgs_adam_precond
        kind: qqn
        oracle: lbfgs_adam
        history_size: 4
        line_search: strong_wolfe
        path_strategy: quadratic
        tangent_mode: preconditioned
        warm_start_preconditioner: true
        c1: 1.0e-4
        c2: 0.9
        ls_max_iter: 4
        max_t: 2.0
        learning_rate: 1.0e-5
        max_qn_gain: 4.0
        anchor_weight_decay: 1.0e-3
        use_lr_schedule: true
        clear_lbfgs_on_refresh: true
        steps: 10
        macro_batch_examples: 128
        inner_steps_per_batch: 2
