experiment_name: gemma4_e2b_aws_macro_batch
output_dir: runs/gemma4_e2b_aws_macro_batch
seed: 42

model:
  variant: gemma4_e2b
  checkpoint: gemma4_e2b_it
  dtype: bfloat16
  master_dtype: float32
  remat: true

data:
  source: gsm8k
  seq_len: 512
  train_examples: 7473          # Full GSM8K training split (prevents fixed-subset memorization)
  val_examples: 128
  micro_batch_size: 8           # 1 sequence per GPU across 8x A100/H100
  batch_mode: macro_batch       # Mode B: consistent macro-batch with refresh_state
  macro_batch_examples: 192     # 24 micro-batches per macro-batch
  inner_steps_per_batch: 2      # 2 QQN steps per macro-batch (prevents batch memorization)

training:
  steps: 45
  eval_every: 3
  checkpoint_every: 0
  l2_reg: 0.0
  fsdp_axis_size: 8
  stop_on_train_loss: 0.0       # Disabled in stochastic macro-batch mode
  stop_on_consecutive_stalls: 3

optimizers:
  - name: adamw_2e-5
    kind: adamw
    learning_rate: 2.0e-5
    warmup_ratio: 0.1
    weight_decay: 0.01
    grad_clip_norm: 1.0
  - name: qqn_adam_2e-5
    kind: qqn
    oracle: adam
    learning_rate: 2.0e-5
    use_lr_schedule: true
    line_search: backtracking
    c1: 1.0e-6
    ls_max_iter: 6
    max_t: 1.0
    remember_step_size: true
  - name: qqn_lbfgs_adam_m5
    kind: qqn
    oracle: lbfgs_adam
    learning_rate: 2.0e-5
    beta2: 0.98
    grad_clip_norm: 1.0
    max_qn_gain: 4.0
    anchor_weight_decay: 1.0e-3
    use_lr_schedule: true
    clear_lbfgs_on_refresh: true
    tangent_mode: preconditioned
    history_size: 5
    line_search: backtracking
    c1: 1.0e-6
    ls_max_iter: 6
    max_t: 1.0
    remember_step_size: true
  - name: qqn_lbfgs_adam_m4_spline
    kind: qqn
    oracle: lbfgs_adam
    learning_rate: 2.0e-5
    beta2: 0.98
    grad_clip_norm: 1.0
    max_qn_gain: 4.0
    anchor_weight_decay: 1.0e-3
    use_lr_schedule: true
    clear_lbfgs_on_refresh: true
    tangent_mode: preconditioned
    history_size: 4
    line_search: backtracking
    path_strategy: spline
    c1: 1.0e-6
    ls_max_iter: 4
    max_t: 2.0
    spline_refine_rounds: 2
    spline_max_control_points: 8
    remember_step_size: true
