# Full-Weight Gemma 4 E2B (`4.65B` params) — OWL-Like 32-bit -> 16-bit Half-Quantization Benchmark
#
# Evaluates the OWL-like quantization optimization regime on 8x A100-40GB / H100-80GB (8-way FSDP):
#   - `dtype: float32`, `master_dtype: float32` (`nn.remat` + `@jax.checkpoint` over `micro_batch_size: 8`
#     = 1 seq/GPU, ~15 GB/GPU peak HBM) so forward/backward sensitivity distinguishes exact 32-bit
#     interior weights from 16-bit `bfloat16` boundaries.
#   - Shared deterministic Stage-1 `float32` GSM8K adaptation (12 steps x 128 ex, `seed: 42`) populates
#     all 23 float32 mantissa bits across active weights and warms the diagonal sensitivity `v`.
#   - Stage 2 holds a fixed 256-example GSM8K calibration batch (`inner_steps_per_batch: 16`) — zero
#     need to memorize new data — seeking minimal `‖θ‖₁` over 16-bit `HalfQuantizationRegion` cells
#     while enforcing `L_train(θ) ≤ L_train(θ_Stage1)` (`no_worse_tol: 0.0`).
#
# Launch on AWS:
#   npm run aws:launch -- --instance p4d.24xlarge --mode owl-quant --spot

experiment_name: gemma4_e2b_aws_owl_quant
output_dir: runs/gemma4_e2b_aws_owl_quant
seed: 42

model:
  variant: gemma4_e2b
  checkpoint: gemma4_e2b_it
  dtype: float32
  master_dtype: float32
  remat: true

data:
  source: gsm8k
  chat_format: true
  seq_len: 512
  train_examples: 2048
  val_examples: 512
  micro_batch_size: 8           # 1 sequence per GPU across 8x A100/H100
  batch_mode: macro_batch
  macro_batch_examples: 256
  inner_steps_per_batch: 16

training:
  steps: 28
  eval_every: 4
  checkpoint_every: 0
  save_best_checkpoint: false
  save_final_checkpoint: false
  checkpoint_dtype: bfloat16
  l2_reg: 0.0
  fsdp_axis_size: 8
  stop_on_consecutive_stalls: 3
  quant_eval_qtype: bfloat16
  quant_eval_bits: 16

optimizers:
  # Control 1: Standard Round-to-Nearest 16-bit PTQ (`bfloat16`)
  - name: ptq_rtn_bf16
    kind: ptq
    phases:
      - name: stage1_fp32_base
        kind: adamw
        steps: 12
        macro_batch_examples: 128
        inner_steps_per_batch: 1
        learning_rate: 2.0e-5
        warmup_ratio: 0.15
        weight_decay: 0.01
        grad_clip_norm: 1.0
      - name: stage2_ptq_rtn
        kind: ptq
        ptq_mode: rtn
        quant_qtype: bfloat16
        steps: 1
        macro_batch_examples: 256
        inner_steps_per_batch: 1

  # Control 2: Round-Toward-Zero 16-bit (`bfloat16` — unconstrained single-cell L1 minimum)
  - name: ptq_rtz_bf16
    kind: ptq
    phases:
      - name: stage1_fp32_base
        kind: adamw
        steps: 12
        macro_batch_examples: 128
        inner_steps_per_batch: 1
        learning_rate: 2.0e-5
        warmup_ratio: 0.15
        weight_decay: 0.01
        grad_clip_norm: 1.0
      - name: stage2_ptq_rtz
        kind: ptq
        ptq_mode: rtz
        quant_qtype: bfloat16
        steps: 1
        macro_batch_examples: 256
        inner_steps_per_batch: 1

  # Control 3: Soft L1 Penalty (`AdamW` on `L_train + λ‖θ‖₁`) — memorizes calibration batch & stays off-grid
  - name: adamw_soft_l1
    kind: adamw
    phases:
      - name: stage1_fp32_base
        kind: adamw
        steps: 12
        macro_batch_examples: 128
        inner_steps_per_batch: 1
        learning_rate: 2.0e-5
        warmup_ratio: 0.15
        weight_decay: 0.01
        grad_clip_norm: 1.0
      - name: stage2_adamw_l1
        kind: adamw
        steps: 16
        macro_batch_examples: 256
        inner_steps_per_batch: 16
        learning_rate: 1.0e-5
        warmup_ratio: 0.0
        warm_start_preconditioner: true
        weight_decay: 0.0
        l1_weight_decay: 1.0e-7
        grad_clip_norm: 1.0

  # Control 4: Midpoint-Walled QuantizationRegion (`[m_{k-1/2}, m_{k+1/2}]`)
  - name: qqn_midpoint_cell_bf16
    kind: owl_quant
    phases:
      - name: stage1_fp32_base
        kind: adamw
        steps: 12
        macro_batch_examples: 128
        inner_steps_per_batch: 1
        learning_rate: 2.0e-5
        warmup_ratio: 0.15
        weight_decay: 0.01
        grad_clip_norm: 1.0
      - name: stage2_midpoint_cell
        kind: owl_quant
        oracle: lbfgs_adam
        history_size: 4
        path_strategy: quadratic
        ls_max_iter: 4
        max_t: 1.0
        learning_rate: 0.75
        max_qn_gain: 4.0
        warm_start_preconditioner: true
        quant_qtype: bfloat16
        quant_region_mode: midpoint_cell
        no_worse_tol: 0.0
        enforce_no_worse: true
        cell_scaled_metric: true
        final_snap: false
        steps: 16
        macro_batch_examples: 256
        inner_steps_per_batch: 16

  # Contender 1: OWL Half-Quantization QQN (`sticky` 16-bit walls + exact terminal snap)
  - name: qqn_owl_halfquant_snap
    kind: owl_quant
    phases:
      - name: stage1_fp32_base
        kind: adamw
        steps: 12
        macro_batch_examples: 128
        inner_steps_per_batch: 1
        learning_rate: 2.0e-5
        warmup_ratio: 0.15
        weight_decay: 0.01
        grad_clip_norm: 1.0
      - name: stage2_owl_snap
        kind: owl_quant
        oracle: lbfgs_adam
        history_size: 4
        path_strategy: quadratic
        ls_max_iter: 4
        max_t: 1.0
        learning_rate: 0.75
        max_qn_gain: 4.0
        warm_start_preconditioner: true
        quant_qtype: bfloat16
        quant_region_mode: half_quant
        quant_boundary_mode: sticky
        no_worse_tol: 0.0
        enforce_no_worse: true
        cell_scaled_metric: true
        final_snap: true
        steps: 16
        macro_batch_examples: 256
        inner_steps_per_batch: 16

  # Contender 2: Multi-Cell OWL Half-Quantization QQN (`owl_snap` + exact terminal snap)
  - name: qqn_owl_halfquant_multicell
    kind: owl_quant
    phases:
      - name: stage1_fp32_base
        kind: adamw
        steps: 12
        macro_batch_examples: 128
        inner_steps_per_batch: 1
        learning_rate: 2.0e-5
        warmup_ratio: 0.15
        weight_decay: 0.01
        grad_clip_norm: 1.0
      - name: stage2_owl_multicell
        kind: owl_quant
        oracle: lbfgs_adam
        history_size: 4
        path_strategy: quadratic
        ls_max_iter: 4
        max_t: 1.5
        learning_rate: 1.25
        max_qn_gain: 4.0
        warm_start_preconditioner: true
        quant_qtype: bfloat16
        quant_region_mode: half_quant
        quant_boundary_mode: owl_snap
        no_worse_tol: 0.0
        enforce_no_worse: true
        cell_scaled_metric: true
        final_snap: true
        steps: 16
        macro_batch_examples: 256
        inner_steps_per_batch: 16
