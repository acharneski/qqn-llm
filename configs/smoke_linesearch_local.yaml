experiment_name: smoke_linesearch_local
output_dir: runs/smoke_linesearch_local
seed: 42

model:
  variant: tiny_smoke
  dtype: bfloat16
  master_dtype: float32
  remat: false
  tiny_num_layers: 2
  tiny_embed_dim: 256
  tiny_hidden_dim: 512
  tiny_num_heads: 4
  tiny_num_kv_heads: 2
  tiny_head_dim: 64
  tiny_vocab_size: 2048

data:
  source: synthetic
  seq_len: 128
  train_examples: 32
  val_examples: 16
  micro_batch_size: 8
  batch_mode: fixed_subset

training:
  steps: 12
  eval_every: 4
  checkpoint_every: 0
  l2_reg: 0.0
  fsdp_axis_size: 1
  stop_on_train_loss: 1.0e-3
  stop_on_consecutive_stalls: 2

optimizers:
  - name: lbfgs_adam_armijo_t1
    kind: qqn
    oracle: lbfgs_adam
    learning_rate: 2.0e-3
    history_size: 5
    line_search: backtracking
    path_strategy: quadratic
    c1: 1.0e-6
    ls_max_iter: 4
    max_t: 1.0
  - name: lbfgs_adam_strong_wolfe
    kind: qqn
    oracle: lbfgs_adam
    learning_rate: 2.0e-3
    history_size: 5
    line_search: strong_wolfe
    path_strategy: quadratic
    tangent_mode: raw
    c1: 1.0e-4
    c2: 0.9
    ls_max_iter: 4
    max_t: 2.0
  - name: lbfgs_adam_strong_wolfe_reparam
    kind: qqn
    oracle: lbfgs_adam
    learning_rate: 2.0e-3
    history_size: 5
    line_search: strong_wolfe
    path_strategy: quadratic
    tangent_mode: reparam
    c1: 1.0e-4
    c2: 0.9
    ls_max_iter: 4
    max_t: 2.0
  - name: lbfgs_adam_strong_wolfe_precond
    kind: qqn
    oracle: lbfgs_adam
    learning_rate: 2.0e-3
    history_size: 5
    line_search: strong_wolfe
    path_strategy: quadratic
    tangent_mode: preconditioned
    c1: 1.0e-4
    c2: 0.9
    ls_max_iter: 4
    max_t: 2.0
  - name: lbfgs_adam_bounded_spline
    kind: qqn
    oracle: lbfgs_adam
    learning_rate: 2.0e-3
    history_size: 5
    line_search: backtracking
    path_strategy: spline
    c1: 1.0e-6
    ls_max_iter: 3
    max_t: 2.0
    spline_refine_rounds: 2
    spline_max_control_points: 8
  - name: lbfgs_adam_linear_chord
    kind: qqn
    oracle: lbfgs_adam
    learning_rate: 2.0e-3
    history_size: 5
    line_search: backtracking
    path_strategy: linear
    c1: 1.0e-6
    ls_max_iter: 4
    max_t: 1.0
  - name: lbfgs_adam_null_search
    kind: qqn
    oracle: lbfgs_adam
    learning_rate: 2.0e-3
    history_size: 5
    line_search: "null"
    path_strategy: quadratic
    max_t: 1.0
